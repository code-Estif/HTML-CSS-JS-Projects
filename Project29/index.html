<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Book</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">
    <div class="container">
        <header>
            <button class="theme-toggle" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
            <h1><i class="fas fa-book-open"></i> My Recipe Book</h1>
            <p>Save and organize your favorite recipes</p>
        </header>

        <div class="app-controls">
            <button class="btn btn-primary" id="addRecipeBtn">
                <i class="fas fa-plus"></i> Add New Recipe
            </button>
            
            <div class="search-filter">
                <input type="text" class="search-box" id="searchInput" placeholder="Search recipes...">
                <select class="filter-select" id="categoryFilter">
                    <option value="">All Categories</option>
                    <option value="Breakfast">Breakfast</option>
                    <option value="Lunch">Lunch</option>
                    <option value="Dinner">Dinner</option>
                    <option value="Dessert">Dessert</option>
                    <option value="Snack">Snack</option>
                    <option value="Beverage">Beverage</option>
                </select>
            </div>
        </div>

        <div class="recipes-grid" id="recipesContainer">
        </div>

        <div class="empty-state" id="emptyState">
            <i class="fas fa-utensils"></i>
            <h3>No recipes yet</h3>
            <p>Add your first recipe to get started!</p>
        </div>
    </div>

    <div class="modal" id="recipeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Add New Recipe</h2>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>
            <form id="recipeForm">
                <input type="hidden" id="recipeId">
                
                <div class="form-group">
                    <label for="recipeName" class="form-label">Recipe Name</label>
                    <input type="text" class="form-control" id="recipeName" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="recipeCategory" class="form-label">Category</label>
                        <select class="form-control" id="recipeCategory" required>
                            <option value="">Select Category</option>
                            <option value="Breakfast">Breakfast</option>
                            <option value="Lunch">Lunch</option>
                            <option value="Dinner">Dinner</option>
                            <option value="Dessert">Dessert</option>
                            <option value="Snack">Snack</option>
                            <option value="Beverage">Beverage</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="cookTime" class="form-label">Cook Time (minutes)</label>
                        <input type="number" class="form-control" id="cookTime" min="1" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="recipeDescription" class="form-label">Description</label>
                    <textarea class="form-control" id="recipeDescription" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="ingredients" class="form-label">Ingredients (one per line)</label>
                    <textarea class="form-control" id="ingredients" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="instructions" class="form-label">Instructions (one step per line)</label>
                    <textarea class="form-control" id="instructions" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="imageUrl" class="form-label">Image URL</label>
                    <input type="text" class="form-control" id="imageUrl" placeholder="https://example.com/image.jpg">
                </div>
                
                <div class="form-actions" style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn btn-warning" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-success">Save Recipe</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="detailTitle">Recipe Details</h2>
                <button class="close-modal" id="closeDetailModal">&times;</button>
            </div>
            <div id="recipeDetailContent">
            </div>
        </div>
    </div>

    <footer>
        <p>Recipe Book App &copy; 2026 | All your recipes stored locally in your browser</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
